# Builds Chrono's downloads on GitHub and publishes them as a release.
#
# To release: on GitHub, Actions > Release > "Run workflow" (on the main branch), type the version
# (e.g. 1.10.0), click "Run workflow". Pushing a tag such as v1.10.0 does the same.
#
# What it needs (Settings > Secrets and variables > Actions):
#   secret   CHRONO_RELEASE_KEY  the release-signing key (see tools/make_release_key.rb). The list
#                                of checksums is signed with it, and Chrono only installs updates
#                                whose list is signed. release-signing.pub (its public half) must be
#                                in the repository.
#   SignPath (code signing of the Windows installer, see README.md, "Code signing policy"):
#   variable SIGNPATH_ORGANIZATION_ID, secret SIGNPATH_API_TOKEN (and optionally the variables
#            SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG). Approve each signing request on
#            signpath.io when asked; the run waits up to an hour.
#   Until SignPath is set up, releases stop with an error rather than going out unsigned by
#   accident. To publish unsigned on purpose, add the variable ALLOW_UNSIGNED_RELEASE = true
#   (the release notes then say the installer isn't signed).
#
# A version that's already released can't be published again (its files are never replaced).
# Only the main branch, or a v* tag, can make a release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.10.0'
        required: true
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest   # SignPath's open-source program requires GitHub-hosted runners
    permissions:
      contents: read   # to check out the code and see whether the release exists
      actions: read    # lets SignPath fetch the unsigned installer
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
      pubkey: ${{ steps.key.outputs.pubkey }}
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${VERSION#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.10.0 (got '$VERSION')"; exit 1; }
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::v$V is already released. Its files are never replaced: release a new version instead."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check the release key
        id: key
        run: |
          [ -f release-signing.pub ] || { echo "::error::release-signing.pub is missing from the repository (see tools/make_release_key.rb)."; exit 1; }
          echo "pubkey=$(tr -d ' \r\n' < release-signing.pub)" >> "$GITHUB_OUTPUT"

      - name: Check code signing is set up
        id: signing
        env:
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          if [ -n "$ORG" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "::warning::SignPath isn't set up: publishing an UNSIGNED Windows installer (ALLOW_UNSIGNED_RELEASE is true)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::SignPath isn't set up (no SIGNPATH_ORGANIZATION_ID variable). To publish unsigned on purpose, add the variable ALLOW_UNSIGNED_RELEASE = true."
            exit 1
          fi

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Check the code
        run: |
          for f in *.rb *.rbw *.lic; do ruby -wc "$f" >/dev/null; done
          ruby test/run_tests.rb

      - name: Build
        run: bash build.sh "${{ steps.version.outputs.version }}"

      - name: Upload unsigned installer for signing
        id: unsigned
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-unsigned
          path: dist/Chrono4Lich-setup-*.exe

      - name: Sign installer with SignPath
        if: steps.signing.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Chrono4Lich' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed installer
        if: steps.signing.outputs.signed == 'true'
        run: cp signed/Chrono4Lich-setup-*.exe dist/

      - name: Keep the downloads for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # to create the release
      id-token: write      # build provenance
      attestations: write  # build provenance
    env:
      V: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Sign the checksum list
        env:
          RELEASE_KEY: ${{ secrets.CHRONO_RELEASE_KEY }}
          PUBKEY: ${{ needs.build.outputs.pubkey }}
        run: |
          [ -n "$RELEASE_KEY" ] || { echo "::error::The CHRONO_RELEASE_KEY secret is missing (see tools/make_release_key.rb)."; exit 1; }
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          printf '%s\n' "$RELEASE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          derived="$(openssl pkey -in "$key" -pubout -outform DER | base64 -w0)"
          [ "$derived" = "$PUBKEY" ] || { echo "::error::CHRONO_RELEASE_KEY doesn't match release-signing.pub."; exit 1; }
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          # check it the way Chrono will
          ruby -ropenssl -e 'k = OpenSSL::PKey.read(ARGV[0].unpack1("m0")); exit(k.verify(nil, File.binread(ARGV[2]), File.binread(ARGV[1])) ? 0 : 1)' \
            "$PUBKEY" SHA256SUMS.txt SHA256SUMS.txt.sig
          cat SHA256SUMS.txt

      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          notes="Windows: download Chrono4Lich-setup-$V.exe and run it. Linux: Chrono4Lich-linux.tar.gz, Mac: Chrono4Lich-mac.tar.gz (see README.txt inside)."
          if [ "$SIGNED" != "true" ]; then notes="$notes

          Note: this Windows installer is not code-signed, so Windows may warn before running it."; fi
          notes="$notes

          SHA256SUMS.txt lists each file's checksum; SHA256SUMS.txt.sig is its signature with Chrono's release key, which Chrono checks before updating itself."
          # (fails if the release exists: published files are never replaced)
          gh release create "v$V" dist/* --target "$GITHUB_SHA" --title "Chrono $V" --notes "$notes"

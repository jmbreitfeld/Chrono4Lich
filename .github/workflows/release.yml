# Builds Chrono's downloads on GitHub and publishes them as a release.
#
# To release: on GitHub, Actions > Release > "Run workflow", type the version (e.g. 1.6.2),
# click "Run workflow". (Pushing a tag such as v1.6.2 does the same.)
#
# Once SignPath is set up (see README.md, "Code signing policy"), the Windows installer is sent
# to SignPath for signing before it's published. Approve the signing request on signpath.io when
# asked; this run waits up to an hour for that. Until then, releases are published unsigned.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.6.2'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write   # to publish the release
  actions: read     # lets SignPath fetch the unsigned installer

jobs:
  release:
    runs-on: ubuntu-latest   # SignPath's open-source program requires GitHub-hosted runners
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Check version
        run: |
          V="${VERSION#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.6.2 (got '$VERSION')"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Build
        run: bash build.sh "$V"

      - name: Upload unsigned installer for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/Chrono4Lich-setup-*.exe

      - name: Sign installer with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Chrono4Lich' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: cp signed/Chrono4Lich-setup-*.exe dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
          else
            gh release create "$TAG" * --target "$GITHUB_SHA" --title "Chrono $V" \
              --notes "Windows: download Chrono4Lich-setup-$V.exe and run it. Linux: Chrono4Lich-linux.tar.gz (see README.txt inside)."
          fi
